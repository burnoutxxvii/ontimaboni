<style>
  :root{
    --bg:#0E0E0F; --bone:#F4F1E9; --amber:#F2B441; --muted:#8c887e;
    --fire:#F2542D; --water:#2E9BD6; --grass:#5FB04A;
    --line:rgba(244,241,233,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#000}
  body{
    font-family:"Barlow Condensed",Arial,sans-serif;color:var(--bone);
    background:radial-gradient(130% 90% at 50% -10%,#1b1b1e 0%,#0d0d0e 55%,#070707 100%);
    min-height:100vh;padding:34px 18px 48px;-webkit-font-smoothing:antialiased;
    position:relative;overflow-x:hidden;
  }
  body::before{ /* grain */
    content:"";position:fixed;inset:0;opacity:.05;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(255,255,255,.7) .5px,transparent .6px);background-size:3px 3px;
  }
  .watermark{
    position:fixed;top:50%;left:50%;width:560px;transform:translate(-50%,-46%);
    opacity:.035;pointer-events:none;z-index:0;filter:grayscale(1);
  }
  .wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto}

  /* Header */
  header{text-align:center;margin-bottom:30px}
  .skull{height:78px;display:block;margin:0 auto 14px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
  .word{width:320px;max-width:74%;display:block;margin:0 auto 18px}
  .title{
    font-family:"Permanent Marker",cursive;font-size:38px;line-height:1.02;color:var(--bone);
    text-shadow:0 3px 0 rgba(0,0,0,.45);
  }
  .title .hl{color:var(--amber)}
  .sub{
    font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.32em;
    font-size:12px;color:var(--muted);margin-top:12px;padding-left:.32em;
  }

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px}

  .card{
    --type:var(--amber);
    background:linear-gradient(180deg,#141416,#0e0e10);
    border:2px solid var(--line);border-radius:18px;
    padding:26px 20px 24px;text-align:center;position:relative;
    display:flex;flex-direction:column;align-items:center;
    transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
    animation:rise .6s cubic-bezier(.2,.7,.2,1) both;
  }
  .card:nth-child(1){animation-delay:.05s}
  .card:nth-child(2){animation-delay:.15s}
  .card:nth-child(3){animation-delay:.25s}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  .card:hover{transform:translateY(-8px);border-color:var(--type);
    box-shadow:0 0 0 1px var(--type),0 18px 40px rgba(0,0,0,.5),0 0 34px -6px var(--type)}
  .card.selected{border-color:var(--type);box-shadow:0 0 0 2px var(--type),0 0 50px -4px var(--type);
    transform:translateY(-6px) scale(1.015)}
  .grid.has-selection .card:not(.selected){opacity:.42;filter:saturate(.6)}

  .badge{
    font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.22em;
    font-size:11px;color:#0e0e10;background:var(--type);padding:5px 12px;border-radius:999px;
    display:inline-block;margin-bottom:4px;
  }
  .name{font-family:"Permanent Marker",cursive;font-size:22px;color:var(--bone);margin:8px 0 2px}

  .stage{height:150px;display:flex;align-items:flex-end;justify-content:center;margin:6px 0 10px}
  .mon{height:140px;animation:bob 3.2s ease-in-out infinite}
  .card:nth-child(2) .mon{animation-delay:-1.1s}
  .card:nth-child(3) .mon{animation-delay:-2.0s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
  .card:hover .mon{animation-duration:1.4s}

  .prompt{font-size:18px;line-height:1.25;color:var(--bone);min-height:48px;
    display:flex;align-items:center;justify-content:center;margin:4px 6px 16px;letter-spacing:.01em}
  .prompt b{color:var(--type);font-weight:600}

  .btn{
    font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.14em;
    font-size:15px;color:#0e0e10;background:var(--bone);border:none;border-radius:10px;
    padding:13px 22px;width:100%;cursor:pointer;transition:transform .12s ease,background .2s ease;
    position:relative;overflow:hidden;
  }
  .btn:hover{background:var(--type);color:#0e0e10}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

  footer{text-align:center;margin-top:40px;font-family:"Oswald",sans-serif;
    text-transform:uppercase;letter-spacing:.3em;font-size:10px;color:var(--muted)}

  /* toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);
    background:var(--bone);color:#0e0e10;font-family:"Oswald",sans-serif;font-weight:600;
    text-transform:uppercase;letter-spacing:.1em;font-size:13px;padding:13px 20px;border-radius:10px;
    box-shadow:0 14px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.28s ease;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .pin{color:var(--accent,#F2542D)}

  @media (max-width:760px){
    .grid{grid-template-columns:1fr;max-width:420px;margin-left:auto;margin-right:auto}
    .title{font-size:30px}
  }
  @media (prefers-reduced-motion:reduce){
    .mon,.card{animation:none!important}
  }
</style>
</head>
